<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 天枢 Tianshu</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form class="login" id="login" autocomplete="on">
    <div class="login-brand"><span class="brand-mark" aria-hidden="true"></span><h1>天枢 <span>Tianshu</span></h1></div>
    <p class="muted">情报与决策中枢</p>
    <input name="username" placeholder="用户名" autocomplete="username" required maxlength="100">
    <input name="password" type="password" placeholder="密码" autocomplete="current-password" required maxlength="1024">
    <button type="submit">登录</button>
    <p class="err" id="err" hidden></p>
  </form>
  <script src="/login.js" type="module"></script>
</body>
</html>
