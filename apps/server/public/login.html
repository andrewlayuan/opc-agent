<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · OPC Radar</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <form class="login" id="login" autocomplete="on">
    <h1>Radar</h1>
    <p class="muted">AI 技术情报</p>
    <input name="username" placeholder="用户名" autocomplete="username" required maxlength="100">
    <input name="password" type="password" placeholder="密码" autocomplete="current-password" required maxlength="1024">
    <button type="submit">登录</button>
    <p class="err" id="err" hidden></p>
  </form>
  <script src="/login.js" type="module"></script>
</body>
</html>
